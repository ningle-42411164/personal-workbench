name: Check personal workbench

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install API integration dependencies
        working-directory: services/workbench-api
        run: npm ci --ignore-scripts
      - name: Test shared API and Worker
        working-directory: services/workbench-api
        run: |
          npm test
          npm run check
      - name: Test local data and isolated cloud operations
        run: npm test
      - name: Build site
        run: npm run build:all
